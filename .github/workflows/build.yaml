name: Build, Tag and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 1.1.0
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Update firmware version in code
      run: |
        VERSION="${{ inputs.version }}"
        sed -i "s/const char\* FIRMWARE_VERSION = \".*\";/const char* FIRMWARE_VERSION = \"$VERSION\";/" src/wifi.ino
        echo "Updated FIRMWARE_VERSION to $VERSION"

    - name: Build project
      run: pio run

    - name: Create tag
      run: |
        VERSION="${{ inputs.version }}"
        TAG_NAME="v$VERSION"
        echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add src/wifi.ino
        git commit -m "Update firmware version to $VERSION" || echo "No changes to commit"
        git tag -f $TAG_NAME
        git push -f origin $TAG_NAME

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.TAG_NAME }}
        release_name: Release ${{ env.TAG_NAME }}
        body: |
          Автоматический релиз firmware версии ${{ env.TAG_NAME }}.

          ## Изменения
          - Обновлена версия прошивки до ${{ env.TAG_NAME }}
        draft: false
        prerelease: false

    - name: Upload firmware
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: .pio/build/nodemcuv2/firmware.bin
        asset_name: firmware.bin
        asset_content_type: application/octet-stream
