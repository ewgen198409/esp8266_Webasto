name: Build, Tag and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 1.1.0
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest # Changed from ubuntu-latest to build a Windows executable
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Update firmware version in code
      shell: pwsh
      run: |
        $VERSION = "${{ inputs.version }}"
        (Get-Content src/wifi.ino) -replace 'const char\* FIRMWARE_VERSION = ".*";', "const char* FIRMWARE_VERSION = `"$VERSION`";" | Set-Content src/wifi.ino
        echo "Updated FIRMWARE_VERSION to $VERSION"

    - name: Build project
      run: pio run

    - name: Install PyInstaller
      run: pip install pyinstaller

    - name: Build Webasto Monitor Executable
      run: |
        cd webasto_monitor
        pyinstaller --onefile --windowed --noupx --icon=webasto_256x256.ico webasto.py

    - name: Create tag
      shell: pwsh
      run: |
        $VERSION = "${{ inputs.version }}"
        $TAG_NAME = "v$VERSION"
        echo "TAG_NAME=$TAG_NAME" >> $env:GITHUB_ENV
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add src/wifi.ino
        git diff-index --quiet HEAD --
        if ($LASTEXITCODE -eq 1) {
            git commit -m "Update firmware version to $VERSION"
        } else {
            echo "No changes to commit"
        }
        git tag -f $TAG_NAME
        git push -f origin $TAG_NAME
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: Release ${{ env.TAG_NAME }}
        body: |
          Автоматический релиз firmware версии ${{ env.TAG_NAME }}.

          ## Изменения
          - Обновлена версия прошивки до ${{ env.TAG_NAME }}
        files: |
          .pio/build/nodemcuv2/firmware.bin
          webasto_monitor/dist/webasto.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
