name: Build, Tag and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 1.1.0
        required: true
        type: string

jobs:
  build_firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Update firmware version in code
      run: |
        VERSION="${{ inputs.version }}"
        sed -i 's/const char\* FIRMWARE_VERSION = ".*";/const char* FIRMWARE_VERSION = "'"$VERSION"'";/' src/wifi.ino
        echo "Updated FIRMWARE_VERSION to $VERSION"

    - name: Build project
      run: pio run

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: .pio/build/nodemcuv2/firmware.bin

  build_webasto_monitor:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install PyInstaller
      run: pip install pyinstaller

    - name: Build Webasto Monitor Executable
      run: |
        cd webasto_monitor
        pyinstaller --onefile --windowed --icon=webasto_256x256.ico webasto.py

    - name: Upload Webasto Monitor artifact
      uses: actions/upload-artifact@v4
      with:
        name: webasto_monitor_exe
        path: webasto_monitor/dist/webasto.exe

  create_release:
    runs-on: ubuntu-latest
    needs: [build_firmware, build_webasto_monitor]
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download firmware artifact
      uses: actions/download-artifact@v4
      with:
        name: firmware
        path: .pio/build/nodemcuv2/

    - name: Download Webasto Monitor artifact
      uses: actions/download-artifact@v4
      with:
        name: webasto_monitor_exe
        path: webasto_monitor/dist/

    - name: Create tag
      run: |
        VERSION="${{ inputs.version }}"
        TAG_NAME="v$VERSION"
        echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add src/wifi.ino
        git commit -m "Update firmware version to $VERSION" || echo "No changes to commit"
        git tag -f $TAG_NAME
        git push -f origin $TAG_NAME

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: Release ${{ env.TAG_NAME }}
        body: |
          Автоматический релиз firmware версии ${{ env.TAG_NAME }}.

          ## Изменения
          - Обновлена версия прошивки до ${{ env.TAG_NAME }}
        files: |
          .pio/build/nodemcuv2/firmware.bin
          webasto_monitor/dist/webasto.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
